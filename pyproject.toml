[project]
name = "halvorai-ingest"
version = "0.4.1"
description = "Signed, attributed payment events for AI agents. Never in the payment path."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "HalvorAI", email = "hello@halvorai.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agents", "agentic-payments", "x402", "audit", "aml", "ape"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=44.0.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "rfc8785>=0.1.4",
]

[project.scripts]
halvorai-ingest = "halvorai_ingest.cli:main"

[project.urls]
Homepage = "https://halvorai.com"
Documentation = "https://docs.halvorai.com"
Source = "https://github.com/halvorAI/ingest-python"
Issues = "https://github.com/halvorAI/ingest-python/issues"
Changelog = "https://github.com/halvorAI/ingest-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halvorai_ingest"]

[tool.hatch.build.targets.sdist]
include = ["halvorai_ingest", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["halvorai_ingest"]
