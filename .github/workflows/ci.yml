name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Oldest supported Python
        run: uv run --isolated --python 3.10 --extra dev pytest -q
